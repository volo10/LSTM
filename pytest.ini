[pytest]
# Pytest configuration for LSTM Frequency Extraction System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test paths
testpaths = .

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete workflows
    slow: Tests that take longer to run
    data: Tests related to data generation
    model: Tests related to model architecture

# Coverage options (when using --cov)
[coverage:run]
source = .
omit = 
    test_*.py
    setup.py
    */tests/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

